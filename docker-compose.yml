# Full stack on one command:  docker compose up --build
# Web: http://localhost:8080   (sign in with consultant@timetrack.dev / Demo123!)
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-TimeTrack_Local_2026!}"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./timetrack-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: SqlServer
      Database__SeedDemoData: "true"
      ConnectionStrings__TimeTrack: "Server=sqlserver;Database=TimeTrack;User Id=sa;Password=${SQL_SA_PASSWORD:-TimeTrack_Local_2026!};TrustServerCertificate=True"
      # Local demo only. In Azure this comes from Key Vault, never from a file.
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-docker-compose-local-signing-key-0123456789}"
      Cors__AllowedOrigins__0: "http://localhost:8080"
    ports:
      - "5080:8080"

  web:
    build: ./timetrack-web
    depends_on:
      - api
    ports:
      - "8080:80"
